<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <title>Login - School Discipline Admin</title>
    <link rel="icon" type="image/png" href="/img/app-icon.png">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons (Local) -->
    <link href='vendor/boxicons/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/loader.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            overflow: auto;
        }

        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 16px;
            box-sizing: border-box;
            /* Premium Teal Gradient */
            background: linear-gradient(135deg, #004d40 0%, #00695c 100%);
            position: relative;
        }

        /* Abstract Pattern Overlay */
        .login-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 1;
        }

        /* Floating Particles Effect */
        .login-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: floatingParticles 20s linear infinite;
            pointer-events: none;
        }

        @keyframes floatingParticles {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 100% 100%;
            }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 440px;
            max-height: calc(100vh - 48px);
            overflow-y: auto;
            box-sizing: border-box;
            text-align: center;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            margin-bottom: 30px;
        }

        .login-icon {
            width: 60px;
            height: 60px;
            background: var(--primary-color);
            color: white;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 105, 92, 0.4);
        }

        h2 {
            color: var(--text-primary);
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
            font-family: inherit;
        }

        input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 105, 92, 0.1);
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            background: #fff;
        }

        select:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 105, 92, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 105, 92, 0.3);
        }

        .btn-secondary {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            color: var(--primary-dark);
            background: transparent;
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-secondary:hover {
            background: rgba(0, 105, 92, 0.08);
        }

        .signup-step-actions {
            display: flex;
            gap: 10px;
        }

        .signup-step-actions button {
            flex: 1;
            margin-top: 10px;
        }

        .error-msg {
            background: #ffebee;
            color: #d32f2f;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            text-align: left;
            border-left: 4px solid #d32f2f;
        }

        .footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <!-- Preloader -->
    <div id="loader-wrapper">
        <img src="img/logo.png" alt="Logo" class="loader-logo">
        <div class="loader-percentage" id="loader-perc">0%</div>
        <div class="loader-bar-bg">
            <div class="loader-bar-fill" id="loader-bar"></div>
        </div>
        <div class="loader-text">System Initializing</div>
    </div>

    <!-- Auto-Redirect if already logged in -->
    <script>
        const userStr = localStorage.getItem('user');
        if (userStr) {
            try {
                const user = JSON.parse(userStr);
                if (user && user.id) {
                    window.location.href = 'dashboard.html';
                }
            } catch (e) {
                localStorage.removeItem('user'); // Corrupt data
            }
        }
    </script>


    <div class="login-wrapper">
        <div class="login-card">
            <div style="text-align: center; margin-bottom: 25px;">
                <img src="img/logo.png" alt="Logo"
                    style="width: 80px; height: 80px; border-radius: 50%; box-shadow: var(--shadow-md); margin-bottom: 15px;">
                <h2 style="margin: 0; color: var(--primary-dark);">Discipline Dept</h2>
                <p style="color: var(--text-secondary); font-size: 0.9rem;">Sign in to manage records</p>
            </div>

            <div id="errorMsg" class="error-msg" role="alert"></div>
            <div id="successMsg" class="error-msg" role="status"
                style="display: none; background: #e8f5e9; color: #2e7d32;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div style="position: relative;">
                        <input type="text" id="username" placeholder="e.g. admin" autocomplete="username" required>
                        <i class='bx bx-user' style="position: absolute; right: 12px; top: 14px; color: #999;"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                        <i class='bx bx-lock-alt' style="position: absolute; right: 12px; top: 14px; color: #999;"></i>
                    </div>
                </div>

                <button type="submit" class="btn-login">Sign In</button>
            </form>

            <button type="button" class="btn-secondary" id="showSignup">Create an account</button>

            <form id="signupForm" hidden novalidate>
                <p id="signupStepIndicator" aria-live="polite">Step 1 of 3: Personal data</p>
                <section data-signup-step="0">
                    <div class="form-group">
                        <label for="signupFullName">Full Name</label>
                        <input type="text" id="signupFullName" name="full_name" autocomplete="name" maxlength="100" required>
                    </div>
                    <div class="form-group">
                        <label for="signupPhone">Phone Number</label>
                        <input type="tel" id="signupPhone" name="phone_number" autocomplete="tel" maxlength="30" required>
                    </div>
                    <div class="form-group">
                        <label for="signupUsername">Username</label>
                        <input type="text" id="signupUsername" name="username" autocomplete="username"
                            minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]+" required>
                    </div>
                </section>
                <section data-signup-step="1" hidden>
                    <div class="form-group">
                        <label for="signupRole">Role</label>
                        <select id="signupRole" name="role" required>
                            <option value="" selected disabled>Choose your role</option>
                            <option value="Teacher">Teacher</option>
                            <option value="Patron">Patron</option>
                            <option value="Matron">Matron</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="signupAllocation">Allocation (class, department, or dormitory)</label>
                        <input type="text" id="signupAllocation" name="allocation" maxlength="100" required>
                    </div>
                </section>
                <section data-signup-step="2" hidden>
                    <div class="form-group">
                        <label for="signupPassword">Password (at least 8 characters)</label>
                        <input type="password" id="signupPassword" name="password" autocomplete="new-password"
                            minlength="8" maxlength="72" required>
                    </div>
                    <div class="form-group">
                        <label for="signupPasswordConfirm">Confirm Password</label>
                        <input type="password" id="signupPasswordConfirm" name="password_confirm"
                            autocomplete="new-password" minlength="8" maxlength="72" required>
                    </div>
                </section>
                <div class="signup-step-actions">
                    <button type="button" class="btn-secondary" id="signupPrevious" hidden>Previous</button>
                    <button type="button" class="btn-login" id="signupNext">Next</button>
                    <button type="submit" class="btn-login" id="signupSubmit" hidden>Create Account</button>
                </div>
                <button type="button" class="btn-secondary" id="showLogin">Back to sign in</button>
            </form>

            <div class="footer">
                &copy; 2026 Murashi Creatives. All rights reserved.
            </div>
        </div>
    </div>

    <script defer src="js/pwa.js"></script>
    <script defer>
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const showSignup = document.getElementById('showSignup');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const signupSteps = [...signupForm.querySelectorAll('[data-signup-step]')];
        const signupStepIndicator = document.getElementById('signupStepIndicator');
        const signupPrevious = document.getElementById('signupPrevious');
        const signupNext = document.getElementById('signupNext');
        const signupSubmit = document.getElementById('signupSubmit');
        let currentSignupStep = 0;

        function setSignupStep(step) {
            currentSignupStep = step;
            signupSteps.forEach((section, index) => {
                section.hidden = index !== step;
            });
            signupStepIndicator.textContent = `Step ${step + 1} of 3: ${
                ['Personal data', 'Role and allocation', 'Passwords'][step]
            }`;
            signupPrevious.hidden = step === 0;
            signupNext.hidden = step === signupSteps.length - 1;
            signupSubmit.hidden = step !== signupSteps.length - 1;
            errorMsg.style.display = 'none';
        }

        function validateSignupStep(step) {
            const fields = signupSteps[step].querySelectorAll('input, select');
            for (const field of fields) {
                if (!field.reportValidity()) return false;
            }
            return true;
        }

        function showMessage(element, message) {
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            element.textContent = message;
            element.style.display = 'block';
        }

        showSignup.addEventListener('click', () => {
            loginForm.hidden = true;
            showSignup.hidden = true;
            signupForm.hidden = false;
            setSignupStep(0);
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
        });

        signupNext.addEventListener('click', () => {
            if (validateSignupStep(currentSignupStep)) {
                setSignupStep(currentSignupStep + 1);
            }
        });

        signupPrevious.addEventListener('click', () => {
            setSignupStep(currentSignupStep - 1);
        });

        document.getElementById('showLogin').addEventListener('click', () => {
            signupForm.hidden = true;
            loginForm.hidden = false;
            showSignup.hidden = false;
            signupForm.reset();
            setSignupStep(0);
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
        });

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            const form = e.currentTarget;
            for (let step = 0; step < signupSteps.length; step++) {
                setSignupStep(step);
                if (!validateSignupStep(step)) {
                    return;
                }
            }

            const password = form.elements.password.value;
            if (password !== form.elements.password_confirm.value) {
                setSignupStep(2);
                showMessage(errorMsg, 'Passwords do not match.');
                return;
            }

            const btn = signupSubmit;
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        full_name: form.elements.full_name.value.trim(),
                        role: form.elements.role.value,
                        allocation: form.elements.allocation.value.trim(),
                        phone_number: form.elements.phone_number.value.trim(),
                        username: form.elements.username.value.trim(),
                        password
                    })
                });
                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.message || data.error || 'Unable to create account.');
                }

                signupForm.reset();
                setSignupStep(0);
                loginForm.elements.username.value = data.username;
                showMessage(successMsg, 'Account created. You can now sign in with your new username and password.');
                signupForm.hidden = true;
                loginForm.hidden = false;
                showSignup.hidden = false;
            } catch (err) {
                showMessage(errorMsg, err.message || 'Connection error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = e.target.querySelector('button');

            errorMsg.style.display = 'none';
            btn.innerHTML = '<i class="bx bx-loader-alt bx-spin"></i> Signing in...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const text = await response.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    console.error('Server returned non-JSON:', text);
                    throw new Error('Server error (HTML). Check console or logs.');
                }

                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500); // Small delay for UX
                } else {
                    const debugMsg = data.debug ? ` | Debug: ${data.debug}` : '';
                    errorMsg.textContent = (data.message || data.error || 'Invalid credentials') + debugMsg;
                    errorMsg.style.display = 'block';
                    btn.innerHTML = 'Sign In';
                    btn.disabled = false;
                }
            } catch (err) {
                console.error('Login Error:', err);
                errorMsg.textContent = err.message || 'Connection error. Please try again.';
                errorMsg.style.display = 'block';
                btn.innerHTML = 'Sign In';
                btn.disabled = false;
            }
        });
    </script>
    <script src="js/loader.js"></script>
    <!-- Hot Reload Logic removed for production stability on Vercel -->
</body>

</html>
